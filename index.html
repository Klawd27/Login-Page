<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login UI</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
      </head>
<body>
  
<div class="wrapper" id="wrapper">

  <!-- FORMS AREA -->
  <div class="forms">

    <form class="form register">
      <h2>Sign Up</h2>
      <input type="text" placeholder="Username">
      <input type="email" placeholder="Email">
      <input type="password" placeholder="Password">
      <button type="button">Sign Up</button>

      <div class="social-box">
      <p>or sign up with social platforms</p>
      <div class="icons">
        <div class="icons">
    <a href="https://google.com" target="_blank"><i class="fab fa-google" fa-3x></i></a>
    <a href="https://facebook.com" target="_blank"><i class="fab fa-facebook-f" fa-3x></i></a>
    <a href="https://instagram.com" target="_blank"><i class="fab fa-instagram" fa-3x></i></a>
    <a href="https://whatsapp.com" target="_blank"><i class="fab fa-whatsapp" fa-3x></i></a>
    </div>
      </div>
    </div>
    </form>
    
    <form class="form login">
      <h2>Login</h2>
      <input type="text" placeholder="Username">
      <input type="password" placeholder="Password">
      <a class="forgot">Forgot Password?</a>
      <button type="button">Login</button>

      <div class="social-box">
  <p>or login with social platforms</p>
  <div class="icons">
    <div class="icons">
  <a href="https://google.com" target="_blank"><i class="fab fa-google" fa-3x></i></a>
  <a href="https://facebook.com" target="_blank"><i class="fab fa-facebook-f" fa-3x></i></a>
  <a href="https://instagram.com" target="_blank"><i class="fab fa-instagram" fa-3x></i></a>
  <a href="https://whatsapp.com" target="_blank"><i class="fab fa-whatsapp" fa-3x></i></a>
</div>
  </div>
</div>

    </form>

  </div>

  <!-- OVERLAY PANEL -->
  <div class="overlay">
    <div class="overlay-content">
      <img src="Logo.png" alt="Logo">
      <h1 id="title">Hello, Welcome</h1>
      <p id="text">Already have an account?</p>
      <button id="switch">Log In</button>
    </div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
